name: publish-npm

# Veröffentlicht das JavaScript-SDK (Verzeichnis js/) auf npm über Trusted Publishing (OIDC).
# npm-Seite: Publisher = logsiegel/logsiegel, Workflow publish-npm.yml, Environment npm.
# Auslösen: `gh workflow run publish-npm.yml -f version=0.1.0`.
# Solange js/package.json fehlt, bricht der Lauf mit klarer Meldung ab (Name ist seit 08.09.2026 reserviert).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, die veröffentlicht wird (muss zu js/package.json passen)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - name: SDK vorhanden?
        working-directory: .
        run: |
          [ -f js/package.json ] || { echo "::error::js/package.json fehlt — es gibt noch kein JavaScript-SDK zu veröffentlichen."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Version prüfen
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "package.json: $PKG, angefordert: ${{ inputs.version }}"
          [ "$PKG" = "${{ inputs.version }}" ] || { echo "::error::Version passt nicht"; exit 1; }
      - run: npm ci
      - run: npm test --if-present
      - run: npm publish --provenance --access public
