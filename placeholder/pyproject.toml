[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsiegel"
version = "0.0.1"
description = "Tamper-evident action trails for AI agents — name-reservation pre-release; the SDK lands with early access."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Stefan Böck" }]

[project.urls]
Homepage = "https://logsiegel.com"
"Early access" = "https://logsiegel.trialcode.net"

[tool.setuptools]
py-modules = ["logsiegel"]
